version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshercv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-freshercv}
      POSTGRES_USER: ${DB_USER:-freshercv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-freshercv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freshercv_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:Resis123#}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: freshercv_pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@freshercv.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin}
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: freshercv_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:freshercv}
      DB_PASSWORD: ${DB_PASSWORD:freshercv123#}
      DB_NAME: ${DB_NAME:freshercv}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:Redis123#}
    ports:
      - "7685:7685"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshercv_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
